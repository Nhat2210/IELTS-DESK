<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#FAFAFA"><title>IELTS Desk — Góc học của Nhật</title>
  <link rel="icon" href="public/icons/icon-32.png"><link rel="stylesheet" href="styles.css">
</head>
<body class="desk-body">
  <header class="mobile-header"><a class="mobile-brand" href="?view=today"><img src="public/icons/mark.svg" alt=""><b>IELTS Desk</b></a><button class="icon-button" id="menu-toggle" aria-label="Mở điều hướng" aria-controls="sidebar" aria-expanded="false" data-icon="menu"></button></header>
  <button class="nav-scrim" id="nav-scrim" aria-label="Đóng điều hướng" hidden></button>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="?view=today"><img src="public/icons/mark.svg" alt=""><span><b>IELTS Desk</b><small>Góc học cá nhân</small></span></a>
    <nav class="main-nav" aria-label="Điều hướng chính">
      <button class="nav-item" data-view="today"><span data-icon="home"></span><span>Hôm nay</span></button>
      <div class="nav-group" role="group" aria-labelledby="nav-study-label">
        <p class="nav-label" id="nav-study-label">Học tập</p>
        <button class="nav-item" data-view="reading"><span data-icon="link"></span><span>Reading</span></button>
        <button class="nav-item" data-view="vocabulary"><span data-icon="book"></span><span>Vocabulary</span></button>
        <button class="nav-item" data-view="review"><span data-icon="cards"></span><span>Ôn tập</span><span class="nav-count" id="review-due" hidden></span></button>
        <button class="nav-item" data-view="notes"><span data-icon="pen"></span><span>Ghi chú</span></button>
        <button class="nav-item" data-view="writing"><span data-icon="pen"></span><span>Luyện viết</span></button>
      </div>
      <div class="nav-progress">
        <button class="nav-item" data-view="progress"><span data-icon="chart"></span><span>Tiến độ</span></button>
      </div>
      <div class="nav-group nav-management" role="group" aria-labelledby="nav-management-label">
        <p class="nav-label" id="nav-management-label">Quản lý</p>
        <button class="nav-item" data-view="library"><span data-icon="inbox"></span><span>Chủ đề & nhóm</span></button>
        <button class="nav-item" data-view="trash"><span data-icon="trash"></span><span>Thùng rác</span></button>
        <button class="nav-item" data-view="settings"><span data-icon="lock"></span><span>Dữ liệu & tùy chọn</span></button>
      </div>
    </nav>
    <div class="sidebar-bottom"><div class="profile"><span class="avatar">N</span><div><b>Nhật</b><small>Học đều, nhớ lâu.</small></div></div></div>
  </aside>
  <main class="main-area"><div class="content" id="app"></div><footer class="desk-footer"><span>IELTS Desk</span><span>Một chút mỗi ngày.</span></footer></main>
  <div class="toast" id="toast" role="status"></div>
  <script src="model.js"></script><script src="common.js"></script><script src="organization.js"></script><script src="reading.js"></script><script src="dashboard.js"></script>
</body></html>
